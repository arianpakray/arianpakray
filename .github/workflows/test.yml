name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stress-scout:
    name: stress-scout on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and Bun
        run: npm install --global @anthropic-ai/claude-code@2.1.312 bun@1
      - name: Validate the plugin
        run: claude plugin validate --strict plugins/stress-scout
      - name: Plugin tests
        run: claude plugin test plugins/stress-scout
      - name: Real file system and git
        run: bun ci/real-fs.ts
      - name: Guard against real bash
        # every case bash really runs must be refused by the guard; needs bash, so not on Windows
        if: runner.os != 'Windows'
        run: bun ci/guard-harness.ts
      - name: Guard against real bash (Git Bash, advisory)
        # not yet shown to work under Git Bash (argument quoting through bash.exe); advisory until it has passed here
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: bun ci/guard-harness.ts
      - name: Offline mode against the real tool
        # sandbox-exec on macOS, unshare -rn on Linux; where the tool is refused it checks the plugin falls back to the guard alone
        if: runner.os != 'Windows'
        run: bun ci/offline-harness.ts
      - name: Commands are documented
        run: bun ci/docs-check.ts
